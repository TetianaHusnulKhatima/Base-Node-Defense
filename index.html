<!DOCTYPE html>
<html lang="ru">
<head><meta charset="UTF-8"><title>8. Node Defense</title><style>body{background:#0b0e14;color:#fff;text-align:center;font-family:sans-serif;}canvas{background:#121824;border:2px solid #0052FF;}</style></head>
<body>
<h1>8. Base Node Defense</h1>
<canvas id="c" width="300" height="200"></canvas>
<script>
const ctx = document.getElementById('c').getContext('2d');
let hits=0, ex=300;
document.onclick = () => { if(ex < 100) { hits++; ex=300; } };
function loop() {
    ctx.clearRect(0,0,300,200);
    ex -= 1.5; if(ex<0) ex=300;
    ctx.fillStyle='#0052FF'; ctx.fillRect(10, 80, 20, 40);
    ctx.fillStyle='#FF0055'; ctx.fillRect(ex, 90, 20, 20);
    ctx.fillStyle='#fff'; ctx.fillText('Защищено спама: '+hits, 10, 20);
    requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
